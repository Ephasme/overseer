[package]
name = "overseer"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
publish = false
description = "Rust CLI agent swarm"
repository = "https://github.com/Ephasme/overseer"

[dependencies]
anyhow = "1.0.104"
# No image-data (pulls in image, objc2-core-*): the clipboard only moves text. Without wayland-data-control the
# Wayland backend is dropped too and paste silently fails on a pure Wayland session.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22"
dotenvy = "0.15.7"
getrandom = "0.3"
gray_matter = { version = "0.3.2", default-features = false, features = ["yaml"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
rhai = "1.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
toml = "1.2.1"
tui-markdown = { version = "0.3.13", default-features = false }
tui-textarea-2 = "0.14.0"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every unwrap and every expect in non-test code is a crash path: name the invariant, or handle the error.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
# Casts that silently truncate or wrap.
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
# Pedantic lints that only fight this codebase's style.
module_name_repetitions = "allow"
too_many_lines = "allow"

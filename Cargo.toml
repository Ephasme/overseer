[package]
name = "overseer"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every unwrap in non-test code is a crash path: name the invariant with expect, or handle the error.
unwrap_used = "warn"
panic = "warn"
indexing_slicing = "warn"
# Casts that silently truncate or wrap.
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
# Pedantic lints that only fight this codebase's style.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"

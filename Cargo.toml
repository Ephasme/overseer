[package]
name = "overseer"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3", default-features = false }
dotenvy = "0.15.7"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tui-textarea-2 = "0.14.0"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every unwrap and every expect in non-test code is a crash path: name the invariant, or handle the error.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
# Casts that silently truncate or wrap.
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
# Pedantic lints that only fight this codebase's style.
module_name_repetitions = "allow"
too_many_lines = "allow"

# cargo deny check: known vulnerabilities, licences, duplicate or yanked crates, foreign sources.

[advisories]
yanked = "deny"

[licenses]
private = { ignore = true }
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSL-1.0", "MPL-2.0", "Unicode-3.0", "Unlicense", "Zlib",
  "ISC", "OpenSSL", "BSD-3-Clause", "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

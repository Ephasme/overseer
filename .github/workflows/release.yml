name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just@1.58
      - run: just release
      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release-please creates the release with the tag; wait for it before uploading.
          for _ in 1 2 3 4 5 6; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then break; fi
            sleep 5
          done
          gh release upload "$GITHUB_REF_NAME" \
            target/release/overseer-cli \
            target/release/overseer-fake-llm \
            --clobber

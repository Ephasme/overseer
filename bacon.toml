# `bacon`: rebuilds on save. `c` clippy (the CI's lints), `t` nextest.
default_job = "clippy"

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets", "--color", "always", "--", "-D", "warnings"]
need_stdout = false

[jobs.test]
command = ["cargo", "nextest", "run", "--color", "always"]
need_stdout = true

[keybindings]
c = "job:clippy"
t = "job:test"
